<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Sai Pavan's GitHub profile</title>
  <desc id="desc">A terminal-inspired profile card showing Sai Pavan's stack, interests, and public GitHub statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151c"/>
      <stop offset="1" stop-color="#181c25"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".12"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .row { font: 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="18" y="18" width="944" height="464" rx="22" fill="url(#bg)" stroke="#303645" filter="url(#shadow)"/>
  <circle cx="52" cy="48" r="6" fill="#f38ba8"/>
  <circle cx="72" cy="48" r="6" fill="#f9e2af"/>
  <circle cx="92" cy="48" r="6" fill="#a6e3a1"/>
  <text x="490" y="54" text-anchor="middle" class="mono" font-size="12" fill="#7f849c">~/saipavan2702/profile</text>
  <line x1="468" y1="82" x2="468" y2="446" stroke="#303645"/>

  <g class="mono">
    <text x="64" y="120" font-size="18" font-weight="700" fill="#cba6f7">sai@github</text>
    <text x="64" y="146" font-size="14" fill="#7f849c">$ whoami</text>
    <text x="64" y="210" font-size="50" font-weight="800" letter-spacing="5" fill="#89b4fa">SAI</text>
    <text x="64" y="266" font-size="50" font-weight="800" letter-spacing="5" fill="#a6e3a1">PAVAN</text>
    <path d="M65 287 H386" stroke="#303645" stroke-width="2"/>
    <text x="64" y="326" font-size="14" fill="#f9e2af">build · learn · repeat</text>
    <text x="64" y="356" font-size="14" fill="#7f849c">One Piece enthusiast</text>
    <text x="64" y="414" font-size="14" fill="#cba6f7">❯</text>
    <rect x="83" y="400" width="9" height="17" rx="1" fill="#cdd6f4" opacity=".8"/>
  </g>

  <text x="510" y="102" class="mono" font-size="18" font-weight="700" fill="#cdd6f4">profile</text>
  <text x="510" y="130" class="row"><tspan fill="#89b4fa">Role</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">Software Engineer</tspan></text>
    <text x="510" y="158" class="row"><tspan fill="#89b4fa">Based</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">India</tspan></text>
    <text x="510" y="186" class="row"><tspan fill="#89b4fa">Frontend</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">React · TypeScript · Tailwind</tspan></text>
    <text x="510" y="214" class="row"><tspan fill="#89b4fa">Backend</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">Node.js · Go · Java · Python</tspan></text>
    <text x="510" y="242" class="row"><tspan fill="#89b4fa">Tools</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">Shell · Neovim · VS Code</tspan></text>
    <text x="510" y="270" class="row"><tspan fill="#89b4fa">Hobbies</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">Anime · Gym · Building things</tspan></text>
    <text x="510" y="326" class="row"><tspan fill="#89b4fa">Public repos</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">42</tspan></text>
    <text x="510" y="354" class="row"><tspan fill="#89b4fa">Followers</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">syncing</tspan></text>
    <text x="510" y="382" class="row"><tspan fill="#89b4fa">Stars earned</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">syncing</tspan></text>
    <text x="510" y="410" class="row"><tspan fill="#89b4fa">On GitHub since</tspan><tspan fill="#7f849c">: </tspan><tspan fill="#a6e3a1">GitHub</tspan></text>
  <text x="510" y="298" class="mono" font-size="18" font-weight="700" fill="#cdd6f4">github.public</text>
  <text x="510" y="446" class="mono" font-size="12" fill="#7f849c">public data · refreshed daily by GitHub Actions</text>
</svg>
